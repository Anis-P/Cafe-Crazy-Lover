<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Cafe Crazy Lover</title>
<meta name="description" content="Explore the full Cafe Crazy Lover menu — coffees, shakes, pizzas, sandwiches, momos, fries and more.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<section class="block" style="padding-top:40px">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow">The Crazy Menu</span>
      <h2>Sip, snack, repeat.</h2>
      <p>Browse our complete lineup. Filter by category, search by craving.</p>
    </div>
    <div style="max-width:520px;margin:0 auto 24px;position:relative">
      <input id="search-input" class="input" placeholder="🔍 Search for coffee, pizza, momos…" style="padding-left:18px;border-radius:50px;text-align:center;font-size:1rem">
    </div>
    <div id="cat-pills" class="cat-pills"></div>
    <p id="result-count" style="text-align:center;color:var(--muted);margin-bottom:24px;font-size:.9rem"></p>
    <div id="menu-grid" class="product-grid"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/main.js"></script>
<script>document.addEventListener('DOMContentLoaded', initMenuPage);</script>
</body></html>
