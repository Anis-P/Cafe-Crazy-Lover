<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Cafe Crazy Lover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="site-header"></div>
<section class="block" style="padding-top:40px"><div class="container">
  <div class="section-head reveal"><span class="eyebrow">Say Hello</span><h2>We'd love to hear from you</h2></div>
  <div class="contact-grid">
    <div class="contact-card reveal">
      <form id="contact-form">
        <div class="form-row"><input class="input" placeholder="Full Name" required><input class="input" placeholder="Phone Number" required></div>
        <input class="input" placeholder="Email Address" type="email" required>
        <textarea class="input" placeholder="Your message" required></textarea>
        <button class="btn btn-primary" type="submit">Send Message →</button>
        <p style="font-size:.78rem;color:var(--muted);margin-top:12px">Form is Formspree-ready — replace the form action attribute when you're ready to go live.</p>
      </form>
    </div>
    <div class="contact-info reveal">
      <p><span class="ico">☎</span><span><strong>Call</strong><br><a href="tel:+917066669903">+91 70666 69903</a></span></p>
      <p><span class="ico">💬</span><span><strong>WhatsApp</strong><br><a href="https://wa.me/917066669903">Open chat</a></span></p>
      <p><span class="ico">✉</span><span><strong>Email</strong><br>hello@cafecrazylover.in</span></p>
      <p><span class="ico">⏰</span><span><strong>Open Hours</strong><br>Daily · 9:00 AM – 11:30 PM</span></p>
      <p><span class="ico">📍</span><span><strong>Address</strong><br>Cafe Crazy Lover, India</span></p>
      <div class="map-wrap" style="margin-top:20px">
        <iframe src="https://maps.google.com/maps?q=cafe&t=&z=13&ie=UTF8&iwloc=&output=embed" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</div></section>
<div id="site-footer"></div>
<script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/main.js"></script>
</body></html>
